# API Configuration

# CORS Settings - Testing
CORS_ORIGIN=http://localhost:3000
CORS_METHODS=GET,POST,PUT,DELETE
CORS_ALLOW_CREDENTIALS=true

# Security Headers - Some may be missing for testing
X_CONTENT_TYPE_OPTIONS=nosniff
X_FRAME_OPTIONS=SAMEORIGIN
STRICT_TRANSPORT_SECURE=false  # HSTS not enabled

# Rate Limiting
RATE_LIMIT_ENABLED=false  # Rate limit disabled for testing

# Authentication Settings
JWT_SECRET=super-secret-key-please-change  # Weak secret
JWT_EXPIRES_IN=24h
